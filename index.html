<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Форма обратной связи</title>
    <style>
        body {
            --bg-color: var(--tg-theme-bg-color, #fff);
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color, #222);
            font-size: 16px;
            margin: 0;
            padding: 0;
            color-scheme: var(--tg-color-scheme);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #222);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #222);
        }

        input[type="text"],
        input[type="tel"] {
            display: block;
            width: 100%;
            padding: 12px 20px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 4px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #222);
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #50a8eb);
        }

        .hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 5px;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        #status.success {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            display: block;
        }

        #status.error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #F44336;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Форма обратной связи</h1>
        <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" placeholder="Введите ваше имя">
            <div class="hint">Необязательное поле</div>
        </div>
        <div class="form-group">
            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" placeholder="+7 (___) ___-__-__">
            <div class="hint">Необязательное поле</div>
        </div>
        <div id="status"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на всю высоту
        tg.ready(); // Сообщаем приложению, что страница загружена

        // Настройка главной кнопки
        tg.MainButton.setText('Отправить данные');
        tg.MainButton.show();
        
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const statusElem = document.getElementById('status');

        // Простая валидация при нажатии на главную кнопку
        tg.MainButton.onClick(function() {
            // Собираем данные из формы
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            
            // Проверка, что хотя бы одно поле заполнено
            if (name === '' && phone === '') {
                statusElem.textContent = 'Пожалуйста, заполните хотя бы одно поле';
                statusElem.className = 'error';
                return;
            }
            
            // Создаем объект с данными для отправки
            const formData = {
                name: name || 'Не указано',
                phone: phone || 'Не указано'
            };
            
            // Отправляем данные обратно в Telegram бот
            tg.sendData(JSON.stringify(formData));
            
            // Показываем сообщение об успешной отправке
            statusElem.textContent = 'Данные успешно отправлены!';
            statusElem.className = 'success';
            
            // Опционально: можно закрыть Mini App через некоторое время
            setTimeout(() => {
                tg.close();
            }, 2000);
        });

        // Простая маска для телефона
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0 && value[0] !== '7') {
                value = '7' + value;
            }
            let formattedValue = '';
            if (value.length > 0) {
                formattedValue = '+' + value[0];
            }
            if (value.length > 1) {
                formattedValue += ' (' + value.substring(1, 4);
            }
            if (value.length > 4) {
                formattedValue += ') ' + value.substring(4, 7);
            }
            if (value.length > 7) {
                formattedValue += '-' + value.substring(7, 9);
            }
            if (value.length > 9) {
                formattedValue += '-' + value.substring(9, 11);
            }
            e.target.value = formattedValue;
        });
    </script>
</body>
</html>
